[workspace]
members = [
    "crates/kernel",
    "crates/session",
    "crates/llm",
    "crates/tools",
    "crates/agent",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
dshrs-kernel = { path = "crates/kernel" }
dshrs-session = { path = "crates/session" }
dshrs-llm = { path = "crates/llm" }
dshrs-tools = { path = "crates/tools" }
dshrs-agent = { path = "crates/agent" }

async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "fs",
    "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
